<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prévias · DL Mídias</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prévias">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#16181d;--muted:#666b75;--line:#e3e0da;--wa:#25d366;--chip:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--card:#1a1d22;--ink:#f1efe9;--muted:#9aa0aa;--line:#2a2e35;--chip:#1a1d22}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.lock{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lock form{width:100%;max-width:360px;display:grid;gap:12px}
.lock h1{font-size:28px;letter-spacing:-.03em}
.lock p{color:var(--muted)}
.lock input[type=password]{height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px;font:inherit;font-size:16px}
.lock label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.lock .erro{color:#c0392b;font-weight:700;min-height:1.2em}
header{padding:24px 16px 4px;max-width:1180px;margin:0 auto}
h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.03em}
header>p{color:var(--muted);margin-top:4px}
.busca{margin-top:16px;width:100%;max-width:420px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px;font:inherit;font-size:16px}
.filtros{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
.filtros button{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.filtros button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding:14px 16px 60px;max-width:1180px;margin:0 auto}
@media (max-width:400px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.thumb img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;object-position:50% 4%}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.topo{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.st{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--line);color:var(--muted)}
.st:empty{display:none}
.st[data-v=enviado],.st[data-v=follow]{background:#e0ecff;color:#1d4ed8}
.st[data-v=respondeu],.st[data-v=interessado]{background:#fff1c2;color:#7a5600}
.st[data-v=fechou]{background:#d6f5e0;color:#0e6b33}
.st.atrasado{background:#ffe1dc;color:#a3261a}
.vis{font-size:13.5px;font-weight:700;border-radius:10px;padding:7px 10px;background:#e8f7ee;color:#0e6b33}
.vis.quente{background:#ffe9d6;color:#9a3d00}
.vis i{font-style:normal;font-size:11px;font-weight:800;background:#16a34a;color:#fff;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
h2{font-size:20px;letter-spacing:-.02em}
.meta{color:var(--muted);font-size:14px}
.meta b{color:var(--ink)}
.alerta{font-size:13px;background:#fff4d6;color:#6b4c00;border-radius:10px;padding:8px 10px;margin-top:2px}
.alerta a{color:inherit;font-weight:800}
.b{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;border:1px solid var(--line);font:inherit;font-weight:700;font-size:14px;color:var(--ink);background:none;text-decoration:none;cursor:pointer;text-align:center;padding:0 8px}
.b--wa{background:var(--wa);color:#06210f;border-color:var(--wa);min-height:52px;font-size:15px}
.b--img{background:var(--ink);color:var(--bg);border-color:var(--ink);min-height:52px;font-size:15px}
.envio{margin-top:8px;border:1px solid var(--line);border-radius:14px;padding:12px}
.envio__t{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.envio__passos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.b--img2{min-height:52px;font-size:14px}
.b--full{grid-column:1/-1}
.thumb{position:relative;display:block}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:24px;padding-left:4px;backdrop-filter:blur(4px)}
.envio__dica{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700;color:var(--muted);margin-top:4px}
.status select{flex:1;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:0 10px}
details{margin-top:4px;font-size:13.5px;color:var(--muted)}
summary{cursor:pointer;font-weight:700;padding:6px 0}
details ul{padding:6px 0 0 18px;display:grid;gap:6px}
.msg-t{font-weight:800;color:var(--ink);margin:10px 0 4px}
pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13.5px;background:var(--bg);border-radius:10px;padding:10px 12px;color:var(--ink)}
.vazio{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
.ok{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.ok.on{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="lock" id="lock">
  <form>
    <h1>Prévias de sites</h1>
    <p>Painel interno. Digite a senha para entrar.</p>
    <input type="password" id="senha" autocomplete="current-password" placeholder="Senha" required>
    <label><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
    <button class="b b--wa" type="submit">Entrar</button>
    <p class="erro" id="erro" role="alert"></p>
  </form>
</div>
<div id="app" hidden>
<header>
  <h1>Prévias de sites</h1>
  <p>110 prévias · atualizado em 14/10/2026 · <span id="resumo"></span></p>
  <input class="busca" type="search" placeholder="Buscar por nome, cidade ou nicho" aria-label="Buscar">
  <div class="filtros" role="group" aria-label="Filtrar">
    <button type="button" data-f="todos" aria-pressed="true">Todos</button>
    <button type="button" data-f="enviar" aria-pressed="false">A enviar</button>
    <button type="button" data-f="abriu" aria-pressed="false">👀 Abriram</button>
    <button type="button" data-f="follow" aria-pressed="false">Cobrar follow-up</button>
    <button type="button" data-f="conversa" aria-pressed="false">Em conversa</button>
    <button type="button" data-f="fechou" aria-pressed="false">Fechados</button>
  </div>
</header>
<main id="lista"></main>
</div>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
async function abrir(senha){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},k,u8(D.c)));
}
const ok=document.querySelector('.ok');
function aviso(t){ok.textContent=t;ok.classList.add('on');setTimeout(()=>ok.classList.remove('on'),1600)}
async function entrar(senha,lembrar){
  try{const h=await abrir(senha);if(lembrar)LS.set('previas-senha',senha);iniciar(h);return true}
  catch(e){LS.del('previas-senha');return false}
}
document.querySelector('.lock form').addEventListener('submit',async e=>{
  e.preventDefault();const er=document.getElementById('erro');er.textContent='Abrindo…';
  if(!await entrar(document.getElementById('senha').value,document.getElementById('lembrar').checked))er.textContent='Senha incorreta.';
});
const salva=LS.get('previas-senha');if(salva)entrar(salva,true);

const ROT={enviado:'Enviado',follow:'Follow-up enviado',respondeu:'Respondeu',interessado:'Interessado',fechou:'Fechou',nao:'Sem interesse'};
let ST={};try{ST=JSON.parse(LS.get('previas-status')||'{}')}catch(e){}
const DIA=864e5;
function grava(){LS.set('previas-status',JSON.stringify(ST))}
function atrasado(x){return x&&(x.s==='enviado')&&Date.now()-x.d>=2*DIA}
function pinta(card){
  const x=ST[card.dataset.slug],st=card.querySelector('[data-st]');
  card.querySelector('[data-status]').value=x?x.s:'';
  st.dataset.v=x?x.s:'';st.classList.toggle('atrasado',!!atrasado(x));
  st.textContent=x?(atrasado(x)?'Cobrar follow-up':ROT[x.s]+' · '+new Date(x.d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})):'';
}
let filtro='todos';
function filtra(){
  const q=document.querySelector('.busca').value.toLowerCase().trim();let vis=0;
  document.querySelectorAll('.card').forEach(c=>{
    const x=ST[c.dataset.slug],s=x?x.s:'';
    const passa=filtro==='todos'||(filtro==='enviar'&&!s)||(filtro==='follow'&&atrasado(x))||(filtro==='abriu'&&VIS[c.dataset.slug]&&VIS[c.dataset.slug].n>0&&s!=='fechou'&&s!=='nao')||(filtro==='conversa'&&(s==='respondeu'||s==='interessado'))||(filtro==='fechou'&&s==='fechou');
    const show=passa&&(!q||c.dataset.busca.includes(q));c.hidden=!show;if(show)vis++;
  });
  document.querySelector('.vazio').hidden=vis>0;
  const v=Object.values(ST);
  document.getElementById('resumo').textContent=v.length+' contatados · '+v.filter(x=>x.s==='fechou').length+' fechados · '+Object.values(VIS).filter(x=>x.n>0).length+' abriram';
}
function iniciar(h){
  LS.set('previas-eu','1');
  document.getElementById('lock').hidden=true;document.getElementById('app').hidden=false;
  const L=document.getElementById('lista');L.innerHTML=h+'<p class="vazio" hidden>Nada por aqui.</p>';
  L.querySelectorAll('.card').forEach(card=>{
    pinta(card);
    card.querySelectorAll('[data-marca]').forEach(a=>a.addEventListener('click',()=>{
      const s=a.dataset.marca,atual=ST[card.dataset.slug];
      if(!atual||atual.s==='enviado'||atual.s==='follow'){ST[card.dataset.slug]={s,d:Date.now()};grava();pinta(card);filtra()}
    }));
    card.querySelector('[data-status]').addEventListener('change',e=>{
      if(e.target.value)ST[card.dataset.slug]={s:e.target.value,d:Date.now()};else delete ST[card.dataset.slug];grava();pinta(card);filtra();
    });
  });
  L.querySelectorAll('[data-imagem]').forEach(b=>b.addEventListener('click',async()=>{
    try{
      const blob=await (await fetch(b.dataset.imagem)).blob();const file=new File([blob],b.dataset.nome,{type:b.dataset.tipo||'image/jpeg'});
      const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
      if(ios&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});aviso(b.dataset.tipo==='video/mp4'?'Toque em "Salvar vídeo"':'Toque em "Salvar imagem"');return}
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=b.dataset.nome;document.body.appendChild(a);a.click();a.remove();
      if(b.dataset.tipo!=='video/mp4'&&!matchMedia('(pointer:coarse)').matches&&window.ClipboardItem){try{const png=await createImageBitmap(blob).then(bm=>{const c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);return new Promise(r=>c.toBlob(r,'image/png'))});await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);aviso('Imagem salva e copiada: cole com Ctrl+V');return}catch(e){}}
      aviso(b.dataset.tipo==='video/mp4'?'Vídeo salvo no aparelho':'Imagem salva no aparelho');
    }catch(e){window.open(b.dataset.imagem,'_blank')}
  }));
  L.querySelectorAll('[data-copiar]').forEach(b=>b.addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(b.dataset.copiar);aviso(b.dataset.ok)}catch(e){prompt('Copie:',b.dataset.copiar)}
  }));
  document.querySelector('.busca').addEventListener('input',filtra);
  document.querySelectorAll('.filtros button').forEach(b=>b.addEventListener('click',()=>{
    filtro=b.dataset.f;document.querySelectorAll('.filtros button').forEach(x=>x.setAttribute('aria-pressed',x===b));filtra();
  }));
  filtra();
  visitas();document.addEventListener('visibilitychange',()=>{if(!document.hidden)visitas()});
}
// visitas de cada prévia (contador público abacus; o site só conta fora deste aparelho). VIS guarda quando o painel viu a 1ª visita.
let VIS={};try{VIS=JSON.parse(LS.get('previas-vis')||'{}')}catch(e){}
const CONT='https://abacus.jasoncameron.dev/get/dlprevias/';
const pega=k=>fetch(CONT+k,{cache:'no-store'}).then(r=>r.ok?r.json():{value:0}).then(j=>j.value||0).catch(()=>null);
async function visitas(){
  const cards=[...document.querySelectorAll('.card')];
  await Promise.all(cards.map(async card=>{
    const s=card.dataset.slug,[n,q]=await Promise.all([pega(s),pega(s+'-quero')]);if(n===null)return;
    const v=VIS[s]||{n:0,q:0,visto:0};
    if(n>v.n){v.novo=n-v.n;if(!v.d)v.d=Date.now();v.ult=Date.now()}
    v.n=n;v.q=q||0;VIS[s]=v;
    const el=card.querySelector('[data-vis]');if(!n&&!v.q){el.hidden=true;return}
    const quando=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    el.hidden=false;el.classList.toggle('quente',v.q>0);
    el.innerHTML=(v.q>0?'🔥 Clicou em "Quero este site"'+(v.q>1?' ('+v.q+'×)':'')+' · ':'')+'👀 Abriu o site '+n+'× '+(v.ult?'· notado em '+quando(v.ult):'')+(v.novo&&v.visto<v.ult?'<i>novo</i>':'');
  }));
  LS.set('previas-vis',JSON.stringify(VIS));
  // depois de mostrar, marca como visto (o selo "novo" some na próxima abertura)
  Object.values(VIS).forEach(v=>{if(v.ult)v.visto=Date.now()});LS.set('previas-vis',JSON.stringify(VIS));
  filtra();
}
</script>
